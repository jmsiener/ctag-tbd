name: draft-release

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Copy config
        run: |
          cp sdkconfig.defaults.strampler sdkconfig.defaults
      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: v5.1.1
          target: esp32
          command: idf.py update-dependencies build
      - name: Upload ctag-tbd.bin
        uses: actions/upload-artifact@v4
        with:
          name: ctag-tbd.bin
          path: /app/jmsiener/ctag-tbd/build/ctag-tbd.bin
      - name: Upload bootloader.bin
        uses: actions/upload-artifact@v4
        with:
          name: bootloader.bin
          path: /app/ctag-fh-kiel/ctag-tbd/build/bootloader/*.bin
      - name: Upload partition-table.bin
        uses: actions/upload-artifact@v4
          with:
          name: partition-table.bin
          path: /app/jmsiener/ctag-tbd/build/partition_table/partition-table.bin
      - name: Archive binaries
        run: |
          zip --junk-paths binaries /app/jmsiener/ctag-tbd/build/*.bin /app/jmsiener/ctag-tbd/build/bootloader/*.bin /app/jmsiener/ctag-tbd/build/partition_table/*.bin
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries.zip
          # A file, directory or wildcard pattern that describes what to upload
          path: ./binaries.zip
